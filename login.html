<body>

    <div class="search_bar"><span class="material-symbols-outlined search_icon">search</span>

        <div class="action_container">
            <span class="material-symbols-outlined action_icon">person</span>

            <div class="action_container">

    </header>
    <main>
        
        <div class="container">
        <form action="https://www.myntra.com/">
        
            <label for="firstName" class="first_name">FIRST NAME:</label><br>
            <input type="text" id="firstName" placeholder="Enter your first name" required="true"><br>

            <label for="lastName" class="last_name">LAST NAME:</label><br>
            <input type="text" id="lastName" placeholder="Enter your last name"><br><br>

            <label for="phone" class="num">PHONE NO.:</label><br>
            <input type="text" id="phone" placeholder="Phone Number"  required="true"><br><br>

            <label for="email" class="eml">EMAIL:</label><br>
            <input type="email" id="email" placeholder="example@gmail.com"  required="true"><br><br>

            <label for="address" class="adr"> ADDRESS:</label><br>
            <textarea id="address" placeholder="Enter Address"></textarea><br><br>

            <label for="pincode" class="pin">PINCODE:</label>
            <input type="text" id="pincode" placeholder="Enter Pincode"  required="true"><br><br>
          <button class="submit" onclick="alert('Successfully Login !')">Login</button></a>

    </div>
   
    </main>
